services:
  subastaya:
    image: subastaya
    build:
      context: .
      dockerfile: SubastaYa/Dockerfile
    ports:
      - "5080:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=subastaya;Username=postgres;Password=postgres
    depends_on:
      db:
        condition: service_healthy
        
  db:
    image: postgres:16
    environment:
      - POSTGRES_DB=subastaya
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    volumes:
      - subastaya_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
      
volumes:
  subastaya_pgdata: